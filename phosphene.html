<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PHOSPHENE</title>
<style>
:root{
  --a1:#ff2bd6;--a2:#00f0ff;--a3:#b6ff00;--a4:#ffe600;
  --bg:rgba(9,7,18,.74);--line:rgba(255,255,255,.08);--txt:#ece9ff;--dim:#8d88a8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font:12px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
body.nocursor,body.nocursor canvas{cursor:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
body.panel-open canvas#c{transform:translateX(-4vw) scale(1.08)}

/* intro title card */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;z-index:5;transition:opacity 1.8s ease,filter 1.8s ease,transform 1.8s cubic-bezier(.16,1,.3,1)}
#intro.gone{opacity:0;filter:blur(24px);transform:scale(1.35)}
#intro h1{margin:0;padding-left:.45em;font-weight:900;font-size:min(6.2vw,110px);letter-spacing:.45em;white-space:nowrap;color:#fff;mix-blend-mode:difference;animation:breathe 5s ease-in-out infinite}
#intro p{margin:0;max-width:92vw;font:600 10px/1.6 var(--mono);letter-spacing:.35em;text-transform:uppercase;color:#fff;opacity:.75;mix-blend-mode:difference;text-align:center;padding:0 20px}
@keyframes breathe{0%,100%{letter-spacing:.45em;padding-left:.45em;filter:blur(0)}50%{letter-spacing:.7em;padding-left:.7em;filter:blur(1px)}}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;z-index:30;transform:translate(-50%,24px) scale(.96);opacity:0;padding:9px 18px;border-radius:999px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);font:700 10px var(--mono);letter-spacing:.28em;text-transform:uppercase;pointer-events:none;white-space:nowrap;transition:all .4s cubic-bezier(.16,1,.3,1)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* hidden control panel */
#panel{position:fixed;top:0;right:0;z-index:20;height:100%;width:min(440px,100vw);display:flex;flex-direction:column;
  background:var(--bg);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border-left:1px solid rgba(255,255,255,.1);box-shadow:-40px 0 90px rgba(0,0,0,.6);
  transform:translate3d(calc(100% + 80px),0,0) skewX(-10deg) scale(.96);transform-origin:100% 50%;opacity:0;filter:blur(12px);pointer-events:none;
  transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .6s ease,filter .8s cubic-bezier(.16,1,.3,1)}
#panel.open{transform:none;opacity:1;filter:none;pointer-events:auto}
#panel::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--a1),var(--a2),var(--a3),var(--a4),var(--a1));background-size:100% 400%;animation:edge 4s linear infinite;box-shadow:0 0 22px var(--a2),0 0 44px var(--a1)}
@keyframes edge{to{background-position:0 400%}}
#panel.open .sec,#panel.open .top-block{animation:secIn .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*28ms + 120ms)}
@keyframes secIn{from{opacity:0;transform:translateX(60px) skewX(-6deg)}to{opacity:1;transform:none}}

#panel header{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#panel header .logo{font:900 15px system-ui;letter-spacing:.45em;background:linear-gradient(90deg,var(--a1),var(--a4),var(--a2),var(--a3),var(--a1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite}
@keyframes flow{to{background-position:300% 0}}
#panel header .fps{margin-left:auto;font:11px var(--mono);color:var(--dim)}
#panel header .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--txt);font-size:16px;cursor:pointer;line-height:1}
#panel header .x:hover{border-color:var(--a1);box-shadow:0 0 12px var(--a1)}
#pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:40px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#pbody::-webkit-scrollbar{width:8px}
#pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

.top-block{padding:12px 16px;border-bottom:1px solid var(--line)}
.top-block h4{margin:0 0 8px;font:700 10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--txt);border-radius:9px;padding:8px 6px;font:700 10px system-ui;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{border-color:var(--a2);box-shadow:0 0 14px rgba(0,240,255,.35);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.hot{background:linear-gradient(100deg,var(--a1),var(--a2));color:#050510;border-color:transparent}
.btn.hot:hover{box-shadow:0 0 20px rgba(255,43,214,.6)}
.btn.on{background:var(--a3);color:#050510;border-color:var(--a3);box-shadow:0 0 16px rgba(182,255,0,.55)}
.mini{display:flex;align-items:center;gap:8px;margin-top:9px}
.mini label{color:#cfc9ec;min-width:92px}
.mini input[type=range]{flex:1}
.mini .v{font:11px var(--mono);color:var(--a2);min-width:44px;text-align:right}

.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pchip{position:relative;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;color:var(--txt);font:600 11px system-ui;text-align:left;transition:all .2s;overflow:hidden}
.pchip:hover{border-color:var(--a2);transform:translateY(-1px);box-shadow:0 0 14px rgba(0,240,255,.3)}
.pchip.active{border-color:var(--a3);box-shadow:0 0 14px rgba(182,255,0,.45)}
.pchip .sw{flex:none;width:26px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.pchip .k{margin-left:auto;font:10px var(--mono);color:var(--dim)}
.pchip .del{margin-left:auto;color:var(--dim);padding:0 4px}
.pchip .del:hover{color:var(--a1)}

#search{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font:12px system-ui;outline:none}
#search:focus{border-color:var(--a2);box-shadow:0 0 12px rgba(0,240,255,.3)}

.sec{border-bottom:1px solid var(--line)}
.sec.hidden{display:none}
.sec>h3{display:flex;align-items:center;gap:8px;margin:0;padding:11px 16px;font:800 10px system-ui;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;user-select:none;color:#f3f0ff}
.sec>h3 .chev{display:inline-block;width:10px;transition:transform .35s cubic-bezier(.16,1,.3,1);color:var(--a2)}
.sec.collapsed>h3 .chev{transform:rotate(-90deg)}
.sec>h3 .cnt{font:10px var(--mono);color:var(--dim);letter-spacing:.05em}
.sec>h3 .tools{margin-left:auto;display:flex;gap:4px}
.sec>h3 .tools button{width:24px;height:22px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font:12px var(--mono);line-height:1}
.sec>h3 .tools button svg{width:12px;height:12px;display:block;margin:auto}
#pbody.searching .top-block:not(.keep){display:none}
.sec>h3 .tools button:hover{color:#fff;border-color:var(--a1);box-shadow:0 0 10px rgba(255,43,214,.5)}
.sec .body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s cubic-bezier(.16,1,.3,1)}
.sec.collapsed .body{grid-template-rows:0fr}
.sec .inner{overflow:hidden;padding:0 16px}
.sec .inner>.pad{padding:2px 0 12px}

.row{padding:5px 0 5px}
.row.hidden{display:none}
.row .top{display:flex;align-items:center;gap:6px;min-height:20px}
.row label{flex:1;color:#cfc9ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.row .val{width:64px;font:11px var(--mono);color:var(--a2);text-align:right;background:transparent;border:1px solid transparent;border-radius:5px;padding:1px 4px;outline:none}
.row .val:hover{border-color:var(--line)}
.row .val:focus{border-color:var(--a2);background:rgba(0,240,255,.08)}
.row.modded .val{color:var(--a3)}
.lb{flex:none;width:24px;height:18px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--dim);font:10px var(--mono);cursor:pointer;padding:0}
.lb:hover{color:#fff;border-color:var(--a3)}
.lb.on{color:#050510;background:var(--a3);border-color:var(--a3);box-shadow:0 0 10px rgba(182,255,0,.6)}
.sl{position:relative}
.sl .ghost{position:absolute;top:3px;width:2px;height:12px;margin-left:-1px;background:var(--a3);box-shadow:0 0 8px var(--a3);border-radius:2px;pointer-events:none;display:none}
.row.modded .sl .ghost{display:block}
.lfo{display:none;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;margin:5px 0 3px;padding:7px 8px;border-radius:9px;background:rgba(182,255,0,.05);border:1px solid rgba(182,255,0,.2)}
.row.lfo-open .lfo{display:grid}
.lfo .c{display:flex;flex-direction:column;gap:1px}
.lfo .c span{font:9px var(--mono);color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.lfo select{padding:3px 4px;font-size:11px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:1px 0 0;cursor:pointer;--p:50%}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--a1) 0%,var(--a2) var(--p),rgba(255,255,255,.1) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(0,240,255,.22),0 0 12px var(--a2);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2))}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--a2)}
select{width:100%;background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:12px system-ui;outline:none;cursor:pointer}
select:focus{border-color:var(--a2)}
option{background:#120f22;color:var(--txt)}
.tog{position:relative;flex:none;width:34px;height:18px;border-radius:999px;background:rgba(255,255,255,.12);cursor:pointer;transition:background .25s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.tog.on{background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 12px rgba(0,240,255,.5)}
.tog.on::after{transform:translateX(16px)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:11px var(--mono);color:var(--dim)}
.keys b{color:var(--a2);font-weight:700}
textarea#io{width:100%;height:90px;margin-top:8px;background:rgba(0,0,0,.35);color:var(--txt);border:1px solid var(--line);border-radius:8px;font:10px var(--mono);padding:8px;resize:vertical;outline:none}
textarea#io:focus{border-color:var(--a2)}
@media (max-width:520px){#panel{width:100vw}.btns{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="intro"><h1>PHOSPHENE</h1><p>Warning: intense color, motion and flicker. Not for photosensitive viewers.</p></div>
<div id="toast"></div>
<aside id="panel" aria-hidden="true">
  <header><span class="logo">PHOSPHENE</span><span class="fps" id="fps">-- fps</span><button class="x" id="closeP" title="Close (O)">&times;</button></header>
  <div id="pbody"></div>
</aside>
<script>
"use strict";
/* ============================================================
   PARAMETER SCHEMA
   Every control in the hidden panel is declared here once.
   Uploaded params become GLSL macros p_<id> packed into vec4 P[].
   js:1 = CPU side only, nr:1 = never touched by the randomizer,
   r:[lo,hi] = randomizer range when narrower than the full range.
   ============================================================ */
const SECTIONS = [], PARAMS = [], PBYID = {};
let _sec = null;
function sec(id, title, open) { SECTIONS.push({ id, title, open: !!open }); _sec = id; }
function add(p) { p.sec = _sec; PARAMS.push(p); PBYID[p.id] = p; }
function f(id, label, min, max, def, o) { add(Object.assign({ id, label, type: 'f', min, max, def }, o || {})); }
function n(id, label, min, max, def, o) { add(Object.assign({ id, label, type: 'f', min, max, def, int: 1 }, o || {})); }
function s(id, label, opts, def, o) { add(Object.assign({ id, label, type: 's', opts, min: 0, max: opts.length - 1, def, int: 1 }, o || {})); }
function b(id, label, def, o) { add(Object.assign({ id, label, type: 'b', min: 0, max: 1, def: def ? 1 : 0, int: 1 }, o || {})); }

const PATTERNS = ['Rings', 'Spiral', 'Checker', 'Plasma', 'Voronoi cells', 'KIFS fractal', 'Julia set', 'Truchet flow',
  'Moire', 'Marble', 'Op-art waves', 'Scintillating grid', 'Rotating snakes', 'Hex honeycomb', 'Starburst'];

const PALETTES = {
  'Rainbow':     [.5,.5,.5, .5,.5,.5, 1,1,1, 0,.33,.67],
  'Acid':        [.5,.5,.5, .5,.5,.5, 1,1,.5, .8,.9,.3],
  'Sunset':      [.5,.5,.5, .5,.5,.5, 1,.7,.4, 0,.15,.2],
  'Vaporwave':   [.55,.45,.8, .45,.4,.2, 1,1,1, 0,.5,.35],
  'Toxic':       [.4,.6,.2, .4,.4,.3, 1,1,1, .1,0,.6],
  'Ice':         [.4,.6,.8, .4,.35,.2, 1,1,1, .5,.5,.5],
  'Infrared':    [.5,.3,.3, .5,.3,.4, 1,1,1, 0,.2,.5],
  'Blood':       [.5,.1,.15, .5,.1,.15, 1,1,1, 0,.1,.2],
  'Deep Sea':    [.1,.4,.5, .1,.4,.4, 1,1,1.2, .5,.2,.3],
  'Gold':        [.6,.45,.2, .4,.35,.2, 1,1,1, 0,.05,.15],
  'Candy':       [.8,.5,.6, .2,.4,.4, 2,1,1, 0,.25,.25],
  'Electric':    [.5,.5,.5, .5,.5,.5, 2,1,0, .5,.2,.25],
  'Chrome':      [.5,.5,.5, .5,.5,.5, .8,.8,.8, 0,0,0],
  'Hellfire':    [.6,.25,.1, .5,.3,.1, 1,1,1, 0,.12,.2],
  'Aurora':      [.3,.6,.5, .3,.4,.4, 1,1.2,1, .6,.1,.35],
};
const PAL_NAMES = Object.keys(PALETTES);
const PAL_KEYS = ['paR','paG','paB','pbR','pbG','pbB','pcR','pcG','pcB','pdR','pdG','pdB'];

sec('motion', 'Motion & Time', true);
f('speed', 'Master speed', -2, 3, 1, { r: [.4, 1.5] });
f('zoomSpeed', 'Infinite zoom speed', -2, 2, .3, { r: [-.7, .7] });
f('rotSpeed', 'Spin speed', -2, 2, .05, { r: [-.35, .35] });
f('warpSpeed', 'Warp flow speed', 0, 3, .45, { r: [0, 1.4] });
f('colorSpeed', 'Color cycle speed', -2, 2, .1, { r: [-.5, .5] });
f('patSpeed', 'Pattern speed', -4, 4, .7, { r: [-2, 2] });
f('morphSpeed', 'Shape morph speed', 0, 2, .15, { r: [0, .7] });
n('bpm', 'Pulse tempo (BPM)', 40, 200, 120, { r: [70, 150] });
f('pulse', 'Beat zoom kick', 0, 1, 0, { r: [0, .35] });
f('breath', 'Breathing zoom', 0, 1, .12, { r: [0, .45] });
f('breathRate', 'Breathing rate (Hz)', .02, 2, .11, { r: [.03, .5] });

sec('cam', 'Camera');
f('zoom', 'Zoom (log)', -3, 3, 0, { r: [-.8, .8] });
f('rot', 'Rotation', -3.1416, 3.1416, 0);
f('offX', 'Offset X', -2, 2, 0, { r: [-.3, .3] });
f('offY', 'Offset Y', -2, 2, 0, { r: [-.3, .3] });
f('stretch', 'Aspect stretch', .25, 4, 1, { r: [.75, 1.35] });
f('fisheye', 'Fisheye / bulge', -1, 1, 0, { r: [-.4, .6] });
f('shear', 'Shear', -1, 1, 0, { r: [-.2, .2] });

sec('cmap', 'Complex Map');
s('cfn', 'Function', ['Identity', 'Power z^n', 'Inversion 1/z', 'Exponential e^z', 'Sine sin(z)', 'Mobius spin', 'Joukowski z+1/z', 'Tangent tan(z)', 'Blackhole'], 0, { rw: [4, 2, 1, 1, 1, 2, 1, 1, 1] });
f('cPow', 'Power n', -6, 6, 2, { r: [-4, 4] });
f('cA', 'Parameter A', -2, 2, .5, { r: [-1, 1] });
f('cB', 'Parameter B', -2, 2, 0, { r: [-1, 1] });
f('cMix', 'Map blend', 0, 1, 1, { r: [.4, 1] });
f('cSpin', 'Mobius spin speed', -2, 2, .2, { r: [-.8, .8] });

sec('space', 'Space & Infinity', true);
s('space', 'Space mode', ['Flat', 'Droste spiral', 'Log-polar tunnel', 'Hyperbolic rim', 'Polar unwrap', 'Spinning sphere'], 1, { rw: [2, 4, 3, 2, 1, 1] });
f('dScale', 'Droste scale ratio', 1.2, 12, 3, { r: [1.6, 6] });
n('dTwist', 'Spiral twist (integer = seamless)', -3, 3, 1, { r: [-2, 2] });
n('dArms', 'Arms / repeats', 1, 8, 1, { r: [1, 4] });
f('tDepth', 'Tunnel perspective', 0, 1, .6, { r: [0, 1] });
f('hypK', 'Hyperbolic curvature', 0, 2, 1, { r: [.4, 1.6] });
f('spaceMix', 'Space blend', 0, 1, 1, { r: [.6, 1] });

sec('kal', 'Kaleidoscope & Folds', true);
n('kSeg', 'Mirror segments', 0, 24, 6, { r: [0, 12] });
f('kRot', 'Mirror rotation', -3.1416, 3.1416, 0);
f('kSpin', 'Mirror spin speed', -1, 1, .03, { r: [-.25, .25] });
f('kOffX', 'Inner offset X', -1.5, 1.5, .22, { r: [-.6, .6] });
f('kOffY', 'Inner offset Y', -1.5, 1.5, 0, { r: [-.6, .6] });
n('fIter', 'Fractal folds', 0, 10, 2, { r: [0, 3] });
f('fScale', 'Fold scale', .5, 2.5, 1.3, { r: [1.05, 1.7] });
f('fAngle', 'Fold angle', -3.1416, 3.1416, .6);
f('fOffset', 'Fold offset', 0, 2, .5, { r: [.15, 1.1] });
f('fMorph', 'Fold morph depth', 0, 1, .3, { r: [0, .8] });

sec('warp', 'Warp & Distortion');
f('wAmt', 'Noise warp amount', 0, 2, .18, { r: [0, 1] });
f('wFreq', 'Noise warp frequency', .1, 8, 1.2, { r: [.3, 3] });
n('wOct', 'Noise octaves', 1, 6, 4, { r: [2, 5] });
f('wRec', 'Recursive warp depth', 0, 2, .5, { r: [0, 1.2] });
f('swirl', 'Swirl', -8, 8, 1.1, { r: [-4, 4] });
f('swirlFall', 'Swirl falloff', 0, 4, .8, { r: [.2, 2.5] });
f('ripAmt', 'Ripple amount', 0, .6, .04, { r: [0, .2] });
f('ripFreq', 'Ripple frequency', 0, 40, 10, { r: [2, 25] });
f('pinch', 'Radial pinch', -2, 2, 0, { r: [-.6, .6] });
f('tileRep', 'Mirror tiling (0 = off)', 0, 6, 0, { r: [0, 2.5] });

sec('patA', 'Pattern A', true);
s('aType', 'Generator', PATTERNS, 1, { rw: [2, 3, 2, 2, 2, 2, 2, 2, 1, 2, 1, .4, .4, 1, 1] });
f('aFreq', 'Frequency', .1, 30, 4, { r: [1, 12] });
f('aDetail', 'Detail / sharpness', 0, 1, .5, { r: [.1, .9] });
n('aArms', 'Arms / symmetry', 1, 16, 5, { r: [1, 9] });
f('aTwist', 'Twist', -10, 10, 2, { r: [-5, 5] });
f('aScale', 'Pattern scale', .1, 5, 1, { r: [.4, 2.5] });

sec('patB', 'Pattern B & Blend');
s('bType', 'Generator', ['Off'].concat(PATTERNS), 1, { rw: [3, 2, 2, 2, 2, 2, 2, 2, 2, 1, 2, 1, .3, .3, 1, 1] });
f('bFreq', 'Frequency', .1, 30, 6, { r: [1, 14] });
f('bDetail', 'Detail / sharpness', 0, 1, .5, { r: [.1, .9] });
n('bArms', 'Arms / symmetry', 1, 16, 3, { r: [1, 9] });

/* packing */
const U_PARAMS = PARAMS.filter(p => !p.js);
U_PARAMS.forEach((p, i) => { p.u = i; });
const NVEC = Math.ceil(U_PARAMS.length / 4);
function glslParams() {
  return `uniform vec4 P[${NVEC}];\n` + U_PARAMS.map((p, i) => `#define p_${p.id} P[${i >> 2}].${'xyzw'[i & 3]}`).join('\n') + '\n';
}
function defaults() { const o = {}; PARAMS.forEach(p => { o[p.id] = p.def; }); return o; }
function decimals(p) { if (p.int) return 0; const r = p.max - p.min; return r <= .11 ? 4 : r <= 2.1 ? 3 : r <= 21 ? 2 : 1; }

/* ============================================================
   GLSL: shared header, math, noise, complex numbers
   ============================================================ */
const GLSL_COMMON = `
precision highp float;
precision highp int;
uniform vec2 uRes;
uniform vec4 uPh0;   // pattern, zoom, rotation, warp phases
uniform vec4 uPh1;   // color, morph, kaleido spin, mobius spin
uniform vec4 uPh2;   // moire spin, breath (-1..1), beat phase, master time
uniform vec4 uMisc;  // real time, frame, beat kick envelope, strobe envelope
uniform vec4 uMouse; // xy position, z presence
uniform vec4 uClick; // xy, age, strength
uniform vec4 uAudio; // bass, mid, treble, beat
out vec4 outColor;
#define PI 3.14159265
#define TAU 6.28318531

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float luma(vec3 c){ return dot(c, vec3(.299, .587, .114)); }
vec3 satur(vec3 c, float s){ return mix(vec3(luma(c)), c, s); }
vec3 hueRotate(vec3 c, float h){
  const vec3 k = vec3(.57735027);
  float a = h * TAU, ca = cos(a), sa = sin(a);
  return c * ca + cross(k, c) * sa + k * dot(k, c) * (1. - ca);
}
vec3 hsv2rgb(vec3 c){
  vec3 p = abs(fract(c.xxx + vec3(0., 2./3., 1./3.)) * 6. - 3.);
  return c.z * mix(vec3(1.), clamp(p - 1., 0., 1.), c.y);
}
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * f * (f * (f * 6. - 15.) + 10.);
  float a = hash12(i), b = hash12(i + vec2(1., 0.)), c = hash12(i + vec2(0., 1.)), d = hash12(i + vec2(1., 1.));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p, int oct){
  float s = 0., a = .5, n = 0.;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < oct; i++){ s += a * vnoise(p); n += a; p = m * p + 17.3; a *= .5; }
  return s / max(n, 1e-3);
}
vec2 curl(vec2 p){
  const float e = .05;
  float a = vnoise(p + vec2(0., e)), b = vnoise(p - vec2(0., e));
  float c = vnoise(p + vec2(e, 0.)), d = vnoise(p - vec2(e, 0.));
  return vec2(a - b, -(c - d)) / (2. * e);
}
vec2 cmul(vec2 a, vec2 b){ return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b){ float d = dot(b, b) + 1e-7; return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / d; }
vec2 cexp(vec2 z){ return exp(clamp(z.x, -30., 12.)) * vec2(cos(z.y), sin(z.y)); }
vec2 clog(vec2 z){ return vec2(log(length(z) + 1e-9), atan(z.y, z.x)); }
vec2 cpow(vec2 z, float n){ return cexp(clog(z) * n); }
vec2 csin(vec2 z){ z.y = clamp(z.y, -9., 9.); return vec2(sin(z.x) * cosh(z.y), cos(z.x) * sinh(z.y)); }
vec2 ccos(vec2 z){ z.y = clamp(z.y, -9., 9.); return vec2(cos(z.x) * cosh(z.y), -sin(z.x) * sinh(z.y)); }
float band(float v, float det){
  float c = .5 + .5 * cos(TAU * v);
  float k = mix(1., 12., det * det);
  return clamp((c - .5) * k + .5, 0., 1.);
}
float trapDist(vec2 z, int m){
  if (m == 0) return length(z);
  if (m == 1) return abs(z.y);
  if (m == 2) return abs(length(z) - 1.);
  return min(abs(z.x), abs(z.y));
}
vec3 aces(vec3 x){ return clamp(x * (2.51 * x + .03) / (x * (2.43 * x + .59) + .14), 0., 1.); }
`;

/* ============================================================
   GLSL: pattern generators. Each returns vec2(colorPhase, shade)
   colorPhase stays continuous so palettes never show seams.
   ============================================================ */
const GLSL_PATTERNS = `
vec2 pat(int id, vec2 p, float fr, float det, float arms, float tw, float t){
  float r = length(p), a = atan(p.y, p.x);
  arms = floor(arms + .5);
  if (id == 0) { // rings
    float v = r * fr * .5 - t * .5 + tw * .03 * sin(a * arms);
    return vec2(v * .5, band(v, det));
  }
  if (id == 1) { // log spiral
    float lr = log(r + 1e-3);
    float ph = arms * a / TAU + fr * .3 * lr + tw * .12 * r - t * .4;
    float s = band(ph, det);
    return vec2(fr * .12 * lr + tw * .04 * r - t * .15 + .25 * s, s);
  }
  if (id == 2) { // checker
    vec2 q = rot(tw * .05) * p * fr * .5 + vec2(t * .25, 0.);
    vec2 c = floor(q), g = fract(q) - .5;
    float ch = mod(c.x + c.y, 2.);
    float e = .5 - max(abs(g.x), abs(g.y));
    float bev = smoothstep(0., mix(.35, .02, det), e);
    return vec2((c.x + c.y) * .07 + hash12(c) * .25 + ch * .5, mix(.12, 1., ch) * mix(.55, 1., bev));
  }
  if (id == 3) { // plasma
    vec2 q = p * fr * .5;
    float v = sin(q.x + t) + sin(q.y * 1.3 - t * 1.1) + sin((q.x + q.y) * .7 + t * .7)
            + sin(length(q + 3. * vec2(sin(t * .3), cos(t * .4))) - t) + tw * .1 * sin(a * arms + r * 2.);
    v *= .25;
    return vec2(v * .6, band(v * arms * .5, det));
  }
  if (id == 4) { // voronoi
    vec2 q = p * fr * .4, n = floor(q), f = fract(q);
    float d1 = 8., d2 = 8.; vec2 cid = vec2(0.);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 g = vec2(float(i), float(j));
      vec2 o = .5 + .45 * sin(t * .8 + TAU * hash22(n + g));
      vec2 dv = g + o - f;
      float d = dot(dv, dv);
      if (d < d1) { d2 = d1; d1 = d; cid = n + g; } else if (d < d2) { d2 = d; }
    }
    d1 = sqrt(d1); d2 = sqrt(d2);
    float edge = smoothstep(0., mix(.35, .03, det), d2 - d1);
    return vec2(hash12(cid) * (1. + tw * .1) + d1 * .4, edge * (1. - .5 * d1));
  }
  if (id == 5) { // KIFS fractal with orbit trap
    vec2 q = p * (.35 + fr * .06);
    float sc = 1., tr = 1e9, mo = uPh1.y;
    mat2 R = rot(p_kAngle + .35 * sin(mo) + tw * .05);
    vec2 off = vec2(.62 + .15 * sin(mo * .7), .38 + .12 * cos(mo * .53));
    int it = int(p_kIter + .5), tm = int(p_trap + .5);
    for (int i = 0; i < it; i++) {
      q = abs(q) - off;
      q = R * q;
      q *= p_kScale; sc *= p_kScale;
      tr = min(tr, trapDist(q, tm));
    }
    float s = clamp(exp(-tr * mix(4., 30., det)) * 1.15 + .04, 0., 1.);
    return vec2(-log(tr + 1e-3) * .25 - t * .1 + .1 * sin(a * arms), s);
  }
  if (id == 6) { // julia set
    vec2 z = p * (1.2 / p_jZoom) * (.5 + fr * .12);
    vec2 c = vec2(p_jx, p_jy) + p_jOrbit * vec2(cos(uPh1.y * 1.3), sin(uPh1.y * 1.7));
    int N = int(p_jIter + .5), tm = int(p_trap + .5);
    float it = 0., tr = 1e9, m2 = 0.;
    for (int i = 0; i < N; i++) {
      z = vec2(z.x * z.x - z.y * z.y, 2. * z.x * z.y) + c;
      m2 = dot(z, z);
      tr = min(tr, trapDist(z, tm));
      if (m2 > 256.) break;
      it += 1.;
    }
    if (m2 > 256.) {
      float sm = max(it - log2(log2(m2)) + 4., 0.);
      float s = pow(clamp(sm / float(N) * 6., 0., 1.), mix(.3, 1., det)) + .12;
      return vec2(sqrt(sm) * .3 * (1. + tw * .05) - t * .12, min(s, 1.));
    }
    return vec2(tr * .6 - t * .12 + .5, mix(.1, .75, exp(-tr * 4.)));
  }
  if (id == 7) { // truchet flow
    vec2 q = p * fr * .5, c = floor(q), g = fract(q) - .5;
    float h = hash12(c), fl = 1.;
    if (h > .5) { g.x = -g.x; fl = -1.; }
    vec2 c1 = g - .5, c2 = g + .5;
    float d1 = abs(length(c1) - .5), d2 = abs(length(c2) - .5);
    bool first = d1 < d2;
    float d = first ? d1 : d2;
    float an = first ? atan(c1.y, c1.x) : atan(c2.y, c2.x);
    float flow = an / (PI * .5) * arms * .5 * fl + t * .8;
    float w = mix(.22, .06, det);
    float line = smoothstep(w, w * .4, d);
    return vec2(d * 1.5 + h * .3 + t * .05, line * (.55 + .45 * band(flow, .6)) + (1. - line) * .06);
  }
  if (id == 8) { // moire interference
    vec2 o = (.18 + .03 * tw) * vec2(cos(t * .3), sin(t * .23));
    float v1 = length(p - o) * fr * 1.5, v2 = length(p + o) * fr * 1.5;
    float s = band(v1, det) * band(v2, det);
    return vec2((v1 - v2) * .08 + (v1 + v2) * .02 + sin(a * arms) * .05, s * .9 + .1 * band(v1 - v2, .3));
  }
  if (id == 9) { // marble (recursive domain warp)
    vec2 q = p * fr * .25;
    vec2 a1 = vec2(fbm(q + vec2(0., t * .12), 4), fbm(q + vec2(5.2, 1.3) - t * .08, 4));
    vec2 b1 = vec2(fbm(q + 4. * a1 + vec2(1.7, 9.2) + t * .15, 4), fbm(q + 4. * a1 + vec2(8.3, 2.8) - t * .1, 4));
    float fv = fbm(q + (4. + tw * .3) * b1, 4);
    float s = mix(fv * 1.4, band(fv * arms * .6, det), .5 + .3 * det);
    return vec2(fv * 1.6 + length(a1) * .6 + b1.x * .4, clamp(s, 0., 1.));
  }
  if (id == 10) { // op-art waves
    float w = p.x * fr * .5 + sin(p.y * fr * .2 + t) * (.6 + tw * .15) + .3 * sin(p.y * 2.3 - t * .7 + p.x);
    return vec2(p.y * .15 + w * .04 + t * .03, band(w, det));
  }
  if (id == 11) { // scintillating grid
    vec2 q = p * fr * .5;
    vec2 g = abs(fract(q) - .5);
    float dl = .5 - max(g.x, g.y);
    float lw = mix(.09, .045, det);
    float line = smoothstep(lw, lw * .6, dl);
    float dt = smoothstep(lw * 1.9, lw * 1.5, length(.5 - g));
    return vec2(.1 + t * .02 + dt * .5, max(line * .5, dt));
  }
  if (id == 12) { // rotating snakes (Kitaoka peripheral drift)
    vec2 q = p * fr * .18;
    vec2 c = floor(q), g = fract(q) - .5;
    float dir = mod(c.x + c.y, 2.) * 2. - 1.;
    float rr = length(g) * 2.;
    if (rr > .96) return vec2(fract((g.x + g.y) * 6. * dir), .55);
    float rc = 4., ri = floor(rr * rc);
    float segs = arms * 2. + ri * 4. + 4.;
    float u = fract(atan(g.y, g.x) / TAU * segs + ri * .37 + t * .05 * dir);
    if (dir < 0.) u = 1. - u;
    float fr2 = fract(rr * rc);
    float sep = smoothstep(0., .08, fr2) * smoothstep(1., .92, fr2);
    return vec2(u, mix(.3, 1., sep));
  }
  if (id == 13) { // hex honeycomb
    vec2 q = p * fr * .35;
    const vec2 sq = vec2(1., 1.7320508);
    vec2 h1 = mod(q, sq) - sq * .5, h2 = mod(q - sq * .5, sq) - sq * .5;
    vec2 g = dot(h1, h1) < dot(h2, h2) ? h1 : h2;
    vec2 cid = q - g, ag = abs(g);
    float e = .5 - max(dot(ag, normalize(sq)), ag.x);
    float hh = hash12(floor(cid * 2. + .5));
    float s = smoothstep(0., mix(.25, .02, det), e) * (.65 + .35 * sin(hh * TAU + t * 2.));
    return vec2(hh * .6 + length(cid) * .03 * tw - t * .1, s);
  }
  // 14: starburst
  float lr = log(r + 1e-3);
  float ph = arms * a / TAU + tw * .15 * lr - t * .25;
  float bs = band(ph, det);
  return vec2(lr * fr * .08 - t * .2 + .2 * bs, clamp(bs * (1. - exp(-r * 4.)) + exp(-r * r * 30.), 0., 1.));
}
`;

/* ============================================================
   GLSL: scene + feedback pass
   screen -> interaction -> camera -> complex map -> space (Droste etc.)
   -> kaleidoscope -> folds -> warps -> patterns A/B -> color -> feedback
   ============================================================ */
const GLSL_SCENE = `
uniform sampler2D uPrev;
float gSeam = 1., gFog = 1.;

vec3 palette(float t){
  return vec3(p_paR, p_paG, p_paB) + vec3(p_pbR, p_pbG, p_pbB) * cos(TAU * (vec3(p_pcR, p_pcG, p_pcB) * t + vec3(p_pdR, p_pdG, p_pdB)));
}
vec3 tone4(float u){
  u = fract(u);
  return u < .25 ? vec3(0.) : u < .5 ? vec3(.1, .22, .95) : u < .75 ? vec3(1.) : vec3(1., .92, .1);
}
vec3 thermal(float t){
  t = clamp(t, 0., 1.);
  return clamp(vec3(t * 3., t * 3. - 1., t * 3. - 2.), 0., 1.) + vec3(.35, 0., .55) * sin(PI * clamp(t * 1.6, 0., 1.)) * (1. - t);
}
vec2 blendAB(vec2 A, vec2 B){
  float m = p_bMix;
  int bm = int(p_blend + .5);
  if (bm == 0) return mix(A, B, m);
  if (bm == 1) return A + B * m;
  if (bm == 2) return vec2(A.x + B.x * m * .5, A.y * mix(1., B.y, m));
  if (bm == 3) return abs(A - B * m);
  if (bm == 4) return vec2(mix(A.x, B.x, step(A.y, B.y * m)), max(A.y, B.y * m));
  if (bm == 5) return vec2(mix(A.x, B.x, step(B.y, A.y) * m), min(A.y, mix(1., B.y, m)));
  if (bm == 6) return vec2(A.x + B.x * m * .5, mix(A.y, .5 + .5 * cos(TAU * (A.x - B.x) * 2.), m));
  return mix(A, B, m);
}

void main(){
  vec2 frag = gl_FragCoord.xy;
  vec2 p0 = (frag - .5 * uRes) / uRes.y * 2.;
  vec2 p = p0;

  /* interaction */
  if (uClick.w > 0.) {
    vec2 d = p - uClick.xy; float r = length(d);
    float w = exp(-pow((r - uClick.z * 1.6) * 7., 2.)) * exp(-uClick.z * 1.2) * uClick.w * p_shock;
    p += d / (r + 1e-4) * w * .25;
  }
  {
    vec2 d = p - uMouse.xy; float r2 = dot(d, d);
    p -= d * p_mLens * uMouse.z * .08 / (r2 + .03);
    p = uMouse.xy + rot(p_mSwirl * uMouse.z * exp(-r2 * 4.)) * (p - uMouse.xy);
  }
  p -= uMouse.xy * p_mFollow;

  /* camera */
  p -= vec2(p_offX, p_offY);
  p.x /= p_stretch;
  p.x += p.y * p_shear;
  float kick = clamp(uMisc.z * p_pulse + uAudio.x * p_aBass * .35, 0., 1.5);
  p *= exp(-p_zoom) * (1. + .25 * p_breath * uPh2.y) * (1. - .3 * kick);
  p = rot(p_rot + uPh0.z) * p;
  p *= pow(1. + dot(p, p), p_fisheye * .5);

  /* complex map */
  int cf = int(p_cfn + .5);
  if (cf > 0) {
    vec2 q = p;
    float k = 1. + p_cA;
    if (cf == 1) q = cpow(p, p_cPow);
    else if (cf == 2) q = cdiv(vec2(k, p_cB), p);
    else if (cf == 3) q = cexp(p * k * 1.5 + vec2(p_cB, 0.));
    else if (cf == 4) q = csin(p * k * 1.5 + vec2(0., p_cB));
    else if (cf == 5) {
      vec2 ma = rot(uPh1.w) * vec2(p_cA, p_cB) * .8;
      q = rot(uPh1.w * .5) * cdiv(p - ma, vec2(1., 0.) - cmul(vec2(ma.x, -ma.y), p));
    }
    else if (cf == 6) q = p + cdiv(vec2(.5 + .5 * p_cA, p_cB), p);
    else if (cf == 7) { vec2 zz = p * k; q = cdiv(csin(zz), ccos(zz)); }
    else { float r2 = dot(p, p); q = p * (1. + (p_cA + 1.) * .25 / (r2 + .01)); q = rot(p_cB * 3. / (sqrt(r2) + .2)) * q; }
    q = clamp(q, vec2(-1e3), vec2(1e3));
    p = mix(p, q, p_cMix);
  }

  /* space: droste / tunnel / hyperbolic / polar / sphere */
  int sm = int(p_space + .5);
  if (sm > 0) {
    vec2 q = p;
    float r = length(p) + 1e-6, a = atan(p.y, p.x);
    float arms = floor(p_dArms + .5);
    if (sm == 1) {
      float L = log(max(p_dScale, 1.01));
      vec2 w = vec2(log(r), a) * arms;
      w = cmul(w, vec2(1., -floor(p_dTwist + .5) * L / TAU));
      w.x -= uPh0.y * L;
      float fw = fract(w.x / L);
      gSeam = min(fw, 1. - fw);
      w.x = (fw - .5) * L;
      q = cexp(w);
    } else if (sm == 2) {
      float d = mix(log(r), -.35 / r, p_tDepth);
      q = vec2(abs(a) / PI * arms * 2., d * 2. + uPh0.y * 2.);
      q.x += q.y * floor(p_dTwist + .5) * .25;
      gFog = mix(1., clamp(r * 1.8, 0., 1.), p_spaceMix);
    } else if (sm == 3) {
      float r2 = r * r * p_hypK * .7;
      q = p * 2. / (abs(1. - r2) + .06);
    } else if (sm == 4) {
      q = vec2(abs(a) / PI * arms * 2., r * 2. - uPh0.y * 2.);
    } else {
      float rr = r / 1.1;
      if (rr < 1.) {
        float nz = sqrt(1. - rr * rr);
        vec3 nn = vec3(p / 1.1, nz);
        nn.xz = rot(uPh0.y * 1.5) * nn.xz;
        nn.yz = rot(.35) * nn.yz;
        q = vec2(abs(atan(nn.z, nn.x)) / PI * arms * 2., asin(clamp(nn.y, -1., 1.)) / PI * 4.);
        gFog = mix(1., .3 + .7 * nz, p_spaceMix);
      } else {
        q = p * (1. + (rr - 1.) * 4.);
      }
    }
    p = mix(p, q, p_spaceMix);
  }

  /* kaleidoscope + fractal folds */
  float seg = floor(p_kSeg + .5);
  if (seg >= 2.) {
    float r = length(p), a = atan(p.y, p.x) + p_kRot + uPh1.z;
    float sa = TAU / seg;
    a = mod(a, sa); a = abs(a - .5 * sa);
    p = r * vec2(cos(a), sin(a));
  }
  p -= vec2(p_kOffX, p_kOffY);
  int fi = int(p_fIter + .5);
  if (fi > 0) {
    mat2 fr = rot(p_fAngle + sin(uPh1.y) * p_fMorph * 1.5);
    for (int i = 0; i < fi; i++) {
      p = abs(p) - p_fOffset * (1. + .3 * p_fMorph * sin(uPh1.y * .7 + float(i)));
      p = fr * p;
      p *= p_fScale;
    }
  }

  /* warps */
  {
    float r = length(p);
    p = rot(p_swirl * exp(-r * p_swirlFall)) * p;
    if (p_pinch != 0.) p *= pow(r + 1e-4, p_pinch);
    if (p_ripAmt > 0.) { float rr = length(p); p += p / (rr + 1e-4) * sin(rr * p_ripFreq - uPh0.w * 3.) * p_ripAmt; }
  }
  float wa = p_wAmt + uAudio.y * p_aMid * .5;
  vec2 gw = vec2(.5);
  if (wa > 0.) {
    int oc = int(p_wOct + .5);
    vec2 wp = p * p_wFreq; float t = uPh0.w;
    vec2 q = vec2(fbm(wp + vec2(0., t * .3), oc), fbm(wp + vec2(5.2, 1.3) - vec2(t * .25, 0.), oc));
    if (p_wRec > 0.) {
      vec2 q2 = vec2(fbm(wp + 4. * q + vec2(1.7, 9.2) + t * .15, oc), fbm(wp + 4. * q + vec2(8.3, 2.8) - t * .12, oc));
      q = mix(q, q2, min(p_wRec, 1.)) + (q2 - .5) * max(p_wRec - 1., 0.);
    }
    p += (q - .5) * 2. * wa;
    gw = q;
  }
  if (p_tileRep > .01) { float T = 1.5 / p_tileRep; p = abs(mod(p + T, 2. * T) - T); }

  /* patterns */
  int ia = int(p_aType + .5), ib = int(p_bType + .5) - 1;
  vec2 A = vec2(0.), res = vec2(0.);
  int nl = ib >= 0 ? 2 : 1;
  for (int L = 0; L < nl; L++) {
    bool isB = L == 1;
    vec2 q = p * (isB ? p_bScale : p_aScale);
    if (isB && int(p_blend + .5) == 7) q += p_bMix * .8 * vec2(cos(TAU * A.x), sin(TAU * A.x));
    vec2 R = pat(isB ? ib : ia, q, isB ? p_bFreq : p_aFreq, isB ? p_bDetail : p_aDetail,
                 isB ? p_bArms : p_aArms, isB ? p_bTwist : p_aTwist, isB ? uPh0.x * 1.17 + 3.7 : uPh0.x);
    if (L == 0) A = R; else res = blendAB(A, R);
  }
  if (nl == 1) res = A;

  /* color */
  float v = res.x + (gw.x - .5) * .3 * min(wa, 1.);
  float sh = clamp(res.y, 0., 1.5);
  float ph = v * p_spread + uPh1.x + p_hue + uAudio.z * p_aTreble * .3;
  if (p_bands > .5) ph = floor(ph * p_bands) / p_bands;
  int cm = int(p_cMode + .5);
  vec3 col;
  if (cm == 0) col = palette(ph);
  else if (cm == 1) col = hsv2rgb(vec3(fract(ph), .92, 1.));
  else if (cm == 2) col = thermal(abs(fract(ph * .5) * 2. - 1.));
  else if (cm == 3) col = vec3(.5 + .5 * cos(TAU * (v * p_spread + p_hue)));
  else if (cm == 4) { float l = abs(fract(ph * 2.) - .5) * 2.; col = palette(ph * .5 + .25) * (pow(l, 10.) * 2.2 + .03); }
  else col = tone4(v * p_spread + p_hue);
  col = mix(col, tone4(ph), p_drift);
  col *= mix(1., sh, p_shade);
  float cv = v * p_spread * 2.;
  float fw = min(fwidth(cv), .3);
  float ln = smoothstep(fw * 1.5 + .015, 0., abs(fract(cv + .5) - .5));
  col += palette(ph + .5) * ln * p_lines * .9;
  col += palette(ph + .25) * smoothstep(.025, 0., gSeam) * p_lines * p_spaceMix;
  col = satur(max(col, 0.), p_sat);
  col = (col - .5) * p_contrast + .5;
  col = max(col, 0.) * p_bright;
  col = pow(col, vec3(1. / p_gamma));
  if (p_invert > .5) col = 1. - clamp(col, 0., 1.);
  col *= gFog;

  /* feedback */
  vec2 uv = frag / uRes;
  vec2 asp = vec2(uRes.x / uRes.y, 1.);
  vec2 fq = (uv - .5) * asp;
  int fm = int(p_fbMirror + .5);
  if (fm == 1 || fm == 3) fq.x = abs(fq.x);
  if (fm == 2 || fm == 3) fq.y = abs(fq.y);
  if (fm == 4) { float r = length(fq), a = atan(fq.y, fq.x), sa = TAU / 4.; a = mod(a, sa); a = abs(a - .5 * sa); fq = r * vec2(cos(a), sin(a)); }
  float fz = p_fbZoom + uMisc.z * p_pulse * .02 + uAudio.x * p_aBass * .01;
  fq = rot(-p_fbRot) * fq * exp(-fz) - vec2(p_fbX, p_fbY);
  if (p_fbWarp > 0.) fq += p_fbWarp * curl(fq * p_fbFlow + uPh2.w * .15);
  vec2 suv = fq / asp + .5;
  vec2 dd = suv - .5;
  vec3 prev = vec3(textureLod(uPrev, .5 + dd * (1. + p_fbChroma), 0.).r,
                   textureLod(uPrev, suv, 0.).g,
                   textureLod(uPrev, .5 + dd * (1. - p_fbChroma), 0.).b);
  if (p_fbSharp > 0. || p_fbBlur > 0.) {
    vec2 px = p_fbKernel * max(uRes.y / 540., 1.) / uRes;
    vec3 bl = (textureLod(uPrev, suv + vec2(px.x, 0.), 0.).rgb + textureLod(uPrev, suv - vec2(px.x, 0.), 0.).rgb
             + textureLod(uPrev, suv + vec2(0., px.y), 0.).rgb + textureLod(uPrev, suv - vec2(0., px.y), 0.).rgb) * .25;
    vec3 hp = prev - bl;
    prev = mix(prev, bl, p_fbBlur) + hp * p_fbSharp;
    if (p_fbSharp > 0.) prev = clamp(prev, 0., 1.);
  }
  prev = clamp(satur(hueRotate(prev, p_fbHue), 1. + p_fbSat), 0., 12.) * p_fbGain;
  float mask = smoothstep(p_fbRadius + .2, p_fbRadius - .2, length(p0));
  if (p_fbKey > 0.) mask *= smoothstep(p_fbKey - .08, p_fbKey + .08, luma(col));
  float g = p_fbInject * mask, fa = p_fbAmt;
  vec3 o;
  int md = int(p_fbMode + .5);
  if (md == 0) o = mix(prev, col, (1. - fa) * g);
  else if (md == 1) o = prev * fa + col * g * (1. - fa * .6);
  else if (md == 2) o = max(prev * fa, col * g);
  else if (md == 3) o = abs(col * g - prev * fa);
  else if (md == 4) o = 1. - (1. - clamp(prev * fa, 0., 1.)) * (1. - clamp(col * g, 0., 1.));
  else o = fract(prev * fa + col * g * .6);
  if (any(isnan(o)) || any(isinf(o))) o = vec3(0.);
  outColor = vec4(clamp(o, 0., 12.), 1.);
}
`;

/* ============================================================
   GLSL: post pass (mirror, haze, pixelate, aberration, bloom,
   rainbow edges, grading, tone map, illusion overlays)
   ============================================================ */
const GLSL_POST = `
uniform sampler2D uTex;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float asp = uRes.x / uRes.y;
  int om = int(p_outMirror + .5);
  if (om > 0) {
    vec2 c = (uv - .5) * vec2(asp, 1.);
    if (om == 1 || om == 3) c.x = -abs(c.x);
    if (om == 2 || om == 3) c.y = -abs(c.y);
    if (om >= 4) {
      float n = om == 4 ? 6. : 8.;
      float r = length(c), a = atan(c.y, c.x) + uPh1.z * .5, sa = TAU / n;
      a = mod(a, sa); a = abs(a - .5 * sa);
      c = r * vec2(cos(a), sin(a));
    }
    uv = c / vec2(asp, 1.) + .5;
  }
  if (p_haze > 0.) uv += p_haze * vec2(sin(uv.y * 40. + uMisc.x * 3.), cos(uv.x * 35. + uMisc.x * 2.7));
  if (p_pixel >= 1.) { vec2 bs = p_pixel / uRes; uv = (floor(uv / bs) + .5) * bs; }

  vec2 d = uv - .5;
  float ca = p_ca * (1. + uAudio.w * p_aBeat * 2.);
  vec3 col = vec3(textureLod(uTex, uv - d * ca, 0.).r, textureLod(uTex, uv, 0.).g, textureLod(uTex, uv + d * ca, 0.).b);

  if (p_bloom > 0.) {
    vec3 bl = vec3(0.);
    float base = 1. + p_bloomRad * 3., wsum = 0.;
    for (int i = 0; i < 3; i++) {
      float lod = base + float(i) * 1.3;
      vec2 ts = exp2(lod) / uRes;
      vec3 s = textureLod(uTex, uv, lod).rgb * .4
        + (textureLod(uTex, uv + ts * vec2(.7, .7), lod).rgb + textureLod(uTex, uv + ts * vec2(-.7, .7), lod).rgb
        +  textureLod(uTex, uv + ts * vec2(.7, -.7), lod).rgb + textureLod(uTex, uv + ts * vec2(-.7, -.7), lod).rgb) * .15;
      float w = 1. / (1. + float(i) * .6);
      bl += max(s - p_bloomThr, 0.) * w;
      wsum += w;
    }
    col += bl / wsum * p_bloom * 1.6;
  }

  if (p_edges > 0.) {
    vec2 px = 1.5 / uRes;
    float tl = luma(textureLod(uTex, uv + px * vec2(-1., 1.), 0.).rgb), tc = luma(textureLod(uTex, uv + px * vec2(0., 1.), 0.).rgb);
    float tr = luma(textureLod(uTex, uv + px * vec2(1., 1.), 0.).rgb), ml = luma(textureLod(uTex, uv + px * vec2(-1., 0.), 0.).rgb);
    float mr = luma(textureLod(uTex, uv + px * vec2(1., 0.), 0.).rgb), bl2 = luma(textureLod(uTex, uv + px * vec2(-1., -1.), 0.).rgb);
    float bc = luma(textureLod(uTex, uv + px * vec2(0., -1.), 0.).rgb), br = luma(textureLod(uTex, uv + px * vec2(1., -1.), 0.).rgb);
    float gx = -tl - 2. * ml - bl2 + tr + 2. * mr + br;
    float gy = -bl2 - 2. * bc - br + tl + 2. * tc + tr;
    float e = sqrt(gx * gx + gy * gy);
    vec3 tint = hsv2rgb(vec3(fract(atan(gy, gx) / TAU + uPh1.x * .5), .85, 1.));
    col = mix(col, col * .3, clamp(p_edges * .25, 0., .7)) + tint * e * p_edges;
  }

  float fl = 1. + p_strobe * uMisc.w * 2.5 + uAudio.w * p_aBeat * .6;
  col *= exp2(p_exposure) * fl;
  col = hueRotate(col, p_hueRot);
  col = satur(max(col, 0.), p_postSat);
  int tm = int(p_tonemap + .5);
  if (tm == 0) col = aces(col); else if (tm == 1) col = 1. - exp(-col * 1.3); else col = clamp(col, 0., 1.);
  if (p_posterize > .5) col = floor(col * p_posterize + .5) / p_posterize;

  vec2 c = (gl_FragCoord.xy / uRes - .5) * vec2(asp, 1.);
  if (p_moire > 0.) {
    vec2 o = .06 * vec2(cos(uPh2.x), sin(uPh2.x));
    float mo = .5 + .5 * cos(length(c - o) * p_moireFreq) * cos(length(c + o) * p_moireFreq);
    col = mix(col, col * mo * 1.8, p_moire);
  }
  if (p_scint > 0.) {
    vec2 g = abs(fract(c * p_scintSize) - .5);
    float line = smoothstep(.07, .04, .5 - max(g.x, g.y));
    float dt = smoothstep(.12, .09, length(.5 - g));
    vec3 ov = mix(vec3(.42) * line, vec3(1.), dt);
    col = mix(col * (1. - .6 * p_scint), ov, max(line, dt) * p_scint);
  }
  col *= max(1. - p_vignette * pow(length(c) * 1.1, 2.4), 0.);
  if (p_scan > 0.) col *= 1. - p_scan * (.5 + .5 * sin(gl_FragCoord.y * 2.1 + uMisc.x * 8.));
  col += (hash12(gl_FragCoord.xy + fract(uMisc.x * 7.13) * 137.) - .5) * (p_grain + 1. / 255.);
  if (p_fix > .5) {
    float r = length(c);
    col = mix(col, vec3(0.), smoothstep(.009, .007, r));
    col = mix(col, vec3(1., .1, .1), smoothstep(.005, .003, r));
  }
  outColor = vec4(clamp(col, 0., 1.), 1.);
}
`;
const GLSL_COPY = `
uniform sampler2D uTex;
void main(){ outColor = textureLod(uTex, gl_FragCoord.xy / uRes, 0.); }
`;
const GLSL_VS = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2. - 1., 0., 1.);
}`;

/* ============================================================
   ENGINE: WebGL2 context, programs, ping-pong feedback targets
   ============================================================ */
const TAU = Math.PI * 2;
const cvs = document.getElementById('c');
const gl = cvs.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
function fatal(msg) {
  const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;inset:0;margin:0;padding:24px;color:#ff6bd6;background:#07060c;font:12px/1.5 monospace;white-space:pre-wrap;overflow:auto;z-index:99';
  d.textContent = 'PHOSPHENE could not start.\n\n' + msg;
  document.body.appendChild(d);
  throw new Error(msg);
}
if (!gl) fatal('WebGL2 is not available. Use a current Chrome, Edge, Firefox or Safari with hardware acceleration enabled.');
let HALF = !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'));
gl.getExtension('OES_texture_float_linear');

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh) || '';
    const lines = src.split('\n'); let ctx = '';
    const m = log.match(/ERROR:\s*\d+:(\d+)/);
    if (m) { const ln = +m[1]; for (let i = Math.max(0, ln - 4); i < Math.min(lines.length, ln + 3); i++) ctx += (i + 1) + ': ' + lines[i] + '\n'; }
    fatal('Shader compile error:\n' + log + '\n' + ctx);
  }
  return sh;
}
const VSH = compile(gl.VERTEX_SHADER, GLSL_VS);
function makeProgram(name, body) {
  const src = '#version 300 es\nprecision highp float;\nprecision highp int;\n' + glslParams() + GLSL_COMMON + body;
  const pr = gl.createProgram();
  gl.attachShader(pr, VSH); gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, src)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) fatal('Link error (' + name + '):\n' + gl.getProgramInfoLog(pr));
  const u = {};
  ['uRes', 'uPh0', 'uPh1', 'uPh2', 'uMisc', 'uMouse', 'uClick', 'uAudio', 'uPrev', 'uTex', 'P'].forEach(k => { u[k] = gl.getUniformLocation(pr, k); });
  return { pr, u };
}
const progScene = makeProgram('scene', GLSL_PATTERNS + GLSL_SCENE);
const progPost = makeProgram('post', GLSL_POST);
const progCopy = makeProgram('copy', GLSL_COPY);
gl.bindVertexArray(gl.createVertexArray());
gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);

function makeTarget(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  const levels = Math.floor(Math.log2(Math.max(w, h))) + 1;
  gl.texStorage2D(gl.TEXTURE_2D, levels, HALF ? gl.RGBA16F : gl.RGBA8, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    } else R.tg.classList.remove('on');
  } else if (p.type === 's') R.sel.value = v;
  else R.tog.classList.toggle('on', !!v);
}
function syncUI() { uiDirty = false; for (const id in rows) paintRow(rows[id]); }
function liveUI() {
  for (const id in lfo) {
    const L = lfo[id], R = rows[id];
    if (!R || !L.on || !R.ghost) continue;
    R.ghost.style.left = pct(R.p, E[id]);
    if (document.activeElement !== R.val) R.val.value = fmt(R.p, E[id]);
  }
}

function buildSections() {
  SECTIONS.forEach((S, si) => {
    const sec = el('div', 'sec' + (S.open ? '' : ' collapsed'));
    sec.style.setProperty('--i', si + blockN + 1);
    const ps = PARAMS.filter(p => p.sec === S.id);
    const h = el('h3', null, '<span class="chev">&#9662;</span><span></span><span class="cnt">' + ps.length + '</span>' +
      '<span class="tools"><button title="Randomize this section">' + ICON_DICE + '</button><button title="Reset this section">' + ICON_RESET + '</button></span>');
    h.children[1].textContent = S.title;
    const tb = h.querySelectorAll('.tools button');
    tb[0].onclick = e => {
      e.stopPropagation();
      morphTo(smartRandom(Math.max(chaos, .6), S.id), Math.min(morphDur, 2));
      activePreset = -1; markPresets(); toast(S.title + ' randomized');
    };
    tb[1].onclick = e => {
      e.stopPropagation();
      const t = {};
      ps.forEach(p => { t[p.id] = p.def; delete lfo[p.id]; if (p.sys) state[p.id] = p.def; });
      if (S.id === 'audio') setMic(false);
      morphTo(t, Math.min(morphDur, 1.5));
      uiDirty = true; toast(S.title + ' reset');
    };
    h.onclick = () => sec.classList.toggle('collapsed');
    const body = el('div', 'body'), inner = el('div', 'inner'), pad = el('div', 'pad');
    ps.forEach(p => pad.appendChild(buildRow(p, S.title)));
    inner.appendChild(pad); body.appendChild(inner); sec.append(h, body);
    pbody.appendChild(sec);
    S.el = sec;
  });
}
function buildKeys() {
  const b = block('Keys');
  b.style.setProperty('--i', SECTIONS.length + blockN + 2);
  const g = el('div', 'keys');
  [['O', 'toggle this panel'], ['R', 'randomize'], ['M', 'mutate'], ['D', 'default'], ['1 to 0', 'presets'], ['A', 'autopilot'],
   ['L / K', 'random / clear LFOs'], ['Space', 'pause'], ['[ and ]', 'master speed'], ['S', 'snapshot PNG'], ['F', 'fullscreen'],
   ['Click', 'shockwave'], ['Esc', 'close panel']].forEach(k => { g.appendChild(el('b', null, k[0])); g.appendChild(el('span', null, k[1])); });
  b.appendChild(g);
  const tip = el('div', null, 'Double-click a slider to reset it. Click a value to type it. Press ~ to attach an LFO to any slider.');
  tip.style.cssText = 'margin-top:10px;color:var(--dim);font-size:11px';
  b.appendChild(tip);
}
function filterRows(q) {
  q = q.trim().toLowerCase();
  pbody.classList.toggle('searching', !!q);
  SECTIONS.forEach(S => {
    let any = false;
    S.el.querySelectorAll('.row').forEach(r => { const hit = !q || r.dataset.search.indexOf(q) >= 0; r.classList.toggle('hidden', !hit); if (hit) any = true; });
    S.el.classList.toggle('hidden', !any);
    if (q && any) S.el.classList.remove('collapsed');
  });
}

/* ============================================================
   INPUT, MAIN LOOP, BOOT
   ============================================================ */
function setPanel(open) {
  panelOpen = open;
  panel.classList.toggle('open', open);
  panel.setAttribute('aria-hidden', open ? 'false' : 'true');
  document.body.classList.toggle('panel-open', open);
  if (open) { syncUI(); showCursor(); }
  else if (document.activeElement && panel.contains(document.activeElement)) document.activeElement.blur();
}
$('#closeP').onclick = () => setPanel(false);
let introGone = false;
function dismissIntro() { if (introGone) return; introGone = true; $('#intro').classList.add('gone'); }
setTimeout(dismissIntro, 3800);

window.addEventListener('keydown', e => {
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if ((tag === 'input' && t.type !== 'range') || tag === 'textarea' || tag === 'select') { if (e.key === 'Escape') t.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  dismissIntro();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'o') setPanel(!panelOpen);
  else if (k === 'Escape') setPanel(false);
  else if (k === 'r') doRandom();
  else if (k === 'm') doMutate();
  else if (k === 'd') doDefault();
  else if (k === ' ') togglePause();
  else if (k === 'f') toggleFS();
  else if (k === 's') snapshot();
  else if (k === 'a') toggleAuto();
  else if (k === 'l') { randomLFOs(); toast('Random LFOs'); }
  else if (k === 'k') { setLFOs({}); toast('LFOs cleared'); }
  else if (k === '[' || k === ']') { userSet(PBYID.speed, state.speed + (k === ']' ? .1 : -.1)); toast('Speed ' + state.speed.toFixed(2)); }
  else if (k.length === 1 && k >= '0' && k <= '9') applyPreset(k === '0' ? 9 : +k - 1);
  else return;
  e.preventDefault();
});

/* hidden touch gesture: triple-tap the top-right corner */
let taps = [];
window.addEventListener('pointerdown', e => {
  dismissIntro();
  if (e.pointerType === 'mouse') return;
  if (e.clientX > innerWidth - 90 && e.clientY < 90) {
    const now = e.timeStamp || performance.now();
    taps = taps.filter(t => now - t < 1200); taps.push(now);
    if (taps.length >= 3) { taps = []; setPanel(!panelOpen); }
  }
});
cvs.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('GPU context lost, reloading'); setTimeout(() => location.reload(), 1500); });

let lastT = performance.now(), realT = 0, frameN = 0, uiT = 0;
const perf = { acc: 0, n: 0, fps: 60, lastAdj: 0 };
function adaptRes(now) {
  if (!state.autoRes || paused || after.frozen || document.hidden || now - perf.lastAdj < 1200) return;
  const tf = state.targetFps;
  if (perf.fps < tf * .88 && renderScale > .3) { renderScale = Math.max(.3, renderScale * .85); perf.lastAdj = now; }
  else if (perf.fps > Math.min(tf * 1.12, 57) && renderScale < 1) { renderScale = Math.min(1, renderScale * 1.08); perf.lastAdj = now; }
}
function saveShot() {
  cvs.toBlob(b => {
    if (!b) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'phosphene-' + Date.now() + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
}
function loop(now) {
  requestAnimationFrame(loop);
  if (!window.__hold) tick(now);
}
function tick(now, fixedDt) {
  const rdt = fixedDt !== undefined ? fixedDt : Math.min(Math.max((now - lastT) / 1000, 0), .1); lastT = now;
  const dt = paused ? 0 : rdt;
  if (!paused) realT += rdt;
  stepMorph(rdt); stepAutopilot(rdt);
  computeEffective(dt); stepAudio(rdt); stepPhases(dt); stepPointer(rdt, dt); stepAfter(rdt);
  if (state.after) E.fix = 1;
  for (const p of U_PARAMS) PV[p.u] = E[p.id];
  U.ph0[0] = ph.pat; U.ph0[1] = ph.zoom; U.ph0[2] = ph.rot; U.ph0[3] = ph.warp;
  U.ph1[0] = ph.color; U.ph1[1] = ph.morph; U.ph1[2] = ph.kspin; U.ph1[3] = ph.cspin;
  U.ph2[0] = ph.moire; U.ph2[1] = Math.sin(ph.breath); U.ph2[2] = beatFrac; U.ph2[3] = ph.T;
  U.misc[0] = realT; U.misc[1] = frameN; U.misc[2] = kick; U.misc[3] = strobeEnv;
  resize(false);
  if (!after.frozen || wantShot) { if (!paused && !after.frozen) renderScene(); renderPost(); frameN++; }
  if (wantShot) { wantShot = false; saveShot(); }
  perf.acc += rdt; perf.n++;
  if (perf.acc >= .5) {
    perf.fps = perf.n / perf.acc; perf.acc = 0; perf.n = 0;
    fpsEl.textContent = Math.round(perf.fps) + ' fps  ' + W + 'x' + H;
    adaptRes(now);
  }
  if (panelOpen && now - uiT > 50) { uiT = now; if (uiDirty) syncUI(); liveUI(); }
}

buildTop(); buildSections(); buildKeys();
if (loadFromHash()) { activePreset = -1; markPresets(); }
computeEffective(0);
resize(true);
syncUI();
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
